name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  test-and-lint:
    name: 🧪 Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest tests/ -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build

  security-sast-sca:
    name: 🛡️ SAST & SCA Security Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAST & SCA Tools
        run: |
          pip install bandit pip-audit

      - name: Run SAST (Bandit)
        run: |
          bandit -r backend/app -ll -v

      - name: Run SCA (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run SCA (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=high

  container-security:
    name: 🐳 Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test-and-lint, security-sast-sca]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t pharmacy-backend:local ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t pharmacy-frontend:local ./frontend

      - name: Scan Backend with Trivy (Aqua Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pharmacy-backend:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Frontend with Trivy (Aqua Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pharmacy-frontend:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  k8s-manifest-validation:
    name: ☸️ Kubernetes Manifests Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate K8s Manifests (Dry-run client)
        run: |
          kubectl kustomize k8s/ > full-k8s.yaml
          cat full-k8s.yaml
