apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmacy-backend
  namespace: pharmacy-devsecops
  labels:
    app.kubernetes.io/name: pharmacy-backend
    app.kubernetes.io/part-of: pharmacy-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pharmacy-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pharmacy-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/lovebittermuffin/pharmacy-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pharmacy-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/medicines?limit=1
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: db-storage
              mountPath: /app/data
            - name: tmp-dir
              mountPath: /tmp
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: pharmacy-db-pvc
        - name: tmp-dir
          emptyDir: {}
