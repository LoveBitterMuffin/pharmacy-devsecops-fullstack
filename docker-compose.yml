name: pharmacy-devsecops

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmacy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/pharmacy.db
      - ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - pharmacy-data:/app/data
    networks:
      - pharmacy-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmacy-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pharmacy-network

volumes:
  pharmacy-data:
    name: pharmacy-data

networks:
  pharmacy-network:
    name: pharmacy-network
    driver: bridge
