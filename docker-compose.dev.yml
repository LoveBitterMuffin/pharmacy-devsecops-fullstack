name: pharmacy-devsecops-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmacy-backend-dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/pharmacy.db
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
      - pharmacy-dev-data:/app/data
    networks:
      - pharmacy-dev-network

  frontend:
    image: node:20-alpine
    container_name: pharmacy-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    networks:
      - pharmacy-dev-network

volumes:
  pharmacy-dev-data:

networks:
  pharmacy-dev-network:
    driver: bridge
